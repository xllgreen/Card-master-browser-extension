  <circle cx="417" cy="862" r="5" fill="none" stroke="#FB7299" stroke-width="1.5" filter="url(#glowSoft)"/>
  <circle cx="417" cy="862" r="1.8" fill="#FB7299"/>
  <circle cx="300" cy="862" r="1.5" fill="#A855F7"/>
  <circle cx="534" cy="862" r="1.5" fill="#00A1D6"/>

