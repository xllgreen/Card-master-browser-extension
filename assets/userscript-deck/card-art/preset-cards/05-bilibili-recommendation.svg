    <animate attributeName="r" values="95;135" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="417" cy="560" r="95" fill="none" stroke="#00A1D6" stroke-width="1.5">
    <animate attributeName="r" values="95;135" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- 核心圆 -->
  <circle cx="417" cy="560" r="95" fill="url(#coreGrad)" opacity="0.95"/>
  <circle cx="417" cy="560" r="95" fill="none" stroke="#FB7299" stroke-width="2.5" filter="url(#glowPink)"/>
