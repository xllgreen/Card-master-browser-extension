    <line x1="-30" y1="-36" x2="-42" y2="-56" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="30" y1="-36" x2="42" y2="-56" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
