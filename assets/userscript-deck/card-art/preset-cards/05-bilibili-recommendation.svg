<svg width="834" height="1112" viewBox="0 0 834 1112" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#16203a"/>
      <stop offset="50%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>

    <!-- 边框渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7299"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#00A1D6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- 标题渐变 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7299"/>
      <stop offset="48%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#00A1D6"/>
    </linearGradient>

    <!-- 核心渐变 -->
    <radialGradient id="coreGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#fce7f3"/>
      <stop offset="42%" stop-color="#FB7299"/>
      <stop offset="72%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00A1D6" stop-opacity="0.12"/>
    </radialGradient>

    <!-- 核心光晕 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7299" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- 滤镜 -->
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 网格图案 -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#16203a" stroke-width="0.6"/>
    </pattern>

    <style>
      .cn { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif; }
      .en { font-family: 'Inter','Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="834" height="1112" fill="url(#bgGrad)"/>
  <rect width="834" height="1112" fill="url(#grid)" opacity="0.6"/>

  <!-- 光斑 -->
  <circle cx="110" cy="170" r="230" fill="#FB7299" opacity="0.055"/>
  <circle cx="730" cy="890" r="270" fill="#00A1D6" opacity="0.055"/>
  <circle cx="417" cy="560" r="320" fill="#A855F7" opacity="0.045"/>

  <!-- ===== 外框 ===== -->
  <rect x="22" y="22" width="790" height="1068" rx="30" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  <rect x="32" y="32" width="770" height="1048" rx="24" fill="none" stroke="#2a3a5a" stroke-width="1" opacity="0.7"/>

  <!-- 四角装饰 -->
  <path d="M 62 100 L 62 62 L 100 62" fill="none" stroke="#FB7299" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="62" r="3.5" fill="#FB7299" filter="url(#glowSoft)"/>
  <path d="M 772 100 L 772 62 L 734 62" fill="none" stroke="#00A1D6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="772" cy="62" r="3.5" fill="#00A1D6" filter="url(#glowSoft)"/>
  <path d="M 62 1012 L 62 1050 L 100 1050" fill="none" stroke="#00A1D6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="1050" r="3.5" fill="#00A1D6" filter="url(#glowSoft)"/>
  <path d="M 772 1012 L 772 1050 L 734 1050" fill="none" stroke="#FB7299" stroke-width="3" stroke-linecap="round"/>
  <circle cx="772" cy="1050" r="3.5" fill="#FB7299" filter="url(#glowSoft)"/>

  <!-- ===== 标题区 ===== -->
  <line x1="72" y1="95" x2="300" y2="95" stroke="#FB7299" stroke-width="1.5" opacity="0.55"/>
