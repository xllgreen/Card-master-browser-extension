  <circle cx="417" cy="95" r="4.5" fill="#A855F7" filter="url(#glowPink)"/>
  <circle cx="372" cy="95" r="2" fill="#FB7299"/>
  <circle cx="462" cy="95" r="2" fill="#00A1D6"/>

  <text x="417" y="142" text-anchor="middle" class="cn" font-size="19" fill="#8899bb" letter-spacing="10">万象星核 · NOVABAY</text>

  <text x="417" y="208" text-anchor="middle" class="en" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="0.5">Bilibili-Recommendation</text>

  <text x="417" y="254" text-anchor="middle" class="cn" font-size="21" fill="#c0ccee" letter-spacing="14">B站算法推荐</text>

  <line x1="140" y1="286" x2="694" y2="286" stroke="#2a3a5a" stroke-width="1"/>
  <circle cx="417" cy="286" r="4" fill="#FB7299" filter="url(#glowPink)"/>
  <circle cx="300" cy="286" r="2" fill="#A855F7"/>
  <circle cx="534" cy="286" r="2" fill="#00A1D6"/>

  <!-- ===== 核心区 ===== -->
  <!-- 标注 -->
  <text x="417" y="322" text-anchor="middle" class="cn" font-size="13" fill="#5a6a8a" letter-spacing="5">实时行为流</text>
  <text x="417" y="798" text-anchor="middle" class="cn" font-size="13" fill="#5a6a8a" letter-spacing="5">多目标排序输出</text>
  <text x="108" y="565" text-anchor="middle" class="cn" font-size="12" fill="#5a6a8a" letter-spacing="2">用户画像</text>
  <text x="726" y="565" text-anchor="middle" class="cn" font-size="12" fill="#5a6a8a" letter-spacing="2">内容特征</text>

  <!-- 外轨道 -->
  <circle cx="417" cy="560" r="225" fill="none" stroke="#1e2a4a" stroke-width="1" stroke-dasharray="3 9"/>
  <circle cx="417" cy="560" r="225" fill="none" stroke="#FB7299" stroke-width="1.5" stroke-dasharray="45 1369" opacity="0.7" transform="rotate(-35 417 560)"/>

  <!-- 内轨道 -->
  <circle cx="417" cy="560" r="155" fill="none" stroke="#1e2a4a" stroke-width="1" stroke-dasharray="2 7"/>
  <circle cx="417" cy="560" r="155" fill="none" stroke="#00A1D6" stroke-width="1.5" stroke-dasharray="35 939" opacity="0.7" transform="rotate(55 417 560)"/>

