    <circle cx="331" cy="768" r="7" fill="#22D3EE"/>
    <circle cx="209" cy="646" r="7" fill="#00A1D6"/>
    <circle cx="209" cy="474" r="7" fill="#A855F7"/>
    <circle cx="331" cy="352" r="7" fill="#22D3EE"/>
