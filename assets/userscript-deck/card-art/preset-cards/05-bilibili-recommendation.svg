  <!-- 外八边形 -->
  <polygon points="625,646 503,768 331,768 209,646 209,474 331,352 503,352 625,474" fill="none" stroke="#1e2a4a" stroke-width="1" stroke-dasharray="4 7" opacity="0.5"/>

