    <circle cx="503" cy="768" r="2.2"/>
    <circle cx="331" cy="768" r="2.2"/>
    <circle cx="209" cy="646" r="2.2"/>
    <circle cx="209" cy="474" r="2.2"/>
    <circle cx="331" cy="352" r="2.2"/>
    <circle cx="503" cy="352" r="2.2"/>
    <circle cx="625" cy="474" r="2.2"/>
