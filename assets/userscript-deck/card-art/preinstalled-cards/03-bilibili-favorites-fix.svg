<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1112" viewBox="0 0 834 1112">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#131A2A" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <!-- 星云发光渐变 -->
    <radialGradient id="nebulaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FB7299" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0" />
    </radialGradient>

    <!-- 星核核心渐变 -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FB7299" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0" />
    </radialGradient>

    <!-- 电视图标内部渐变 -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1025" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 网格图案 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.5" />
    </pattern>

    <!-- 科技感虚线图案 -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#00E5FF" opacity="0.3" />
    </pattern>
  </defs>

  <!-- ================= 背景层 ================= -->
  <rect width="834" height="1112" fill="url(#bgGrad)" />
  <rect width="834" height="1112" fill="url(#grid)" />
  <rect width="834" height="1112" fill="url(#dotGrid)" />

  <!-- 星云与星核核心 -->
  <circle cx="417" cy="500" r="350" fill="url(#nebulaGrad)" filter="url(#glowStrong)" />
  <circle cx="417" cy="500" r="180" fill="url(#coreGrad)" filter="url(#glowStrong)" />

  <!-- 背景装饰星星 -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="200" r="1.5" />
    <circle cx="700" cy="150" r="2" />
    <circle cx="150" cy="800" r="1" />
    <circle cx="680" cy="750" r="2.5" />
    <circle cx="80" cy="450" r="1.5" />
    <circle cx="750" cy="500" r="1" />
    <circle cx="200" cy="300" r="2" />
    <circle cx="600" cy="850" r="1.5" />
    <circle cx="400" cy="100" r="1" />
    <circle cx="500" cy="900" r="2" />
  </g>

  <!-- ================= 边框层 ================= -->
  <!-- 外层主边框（切角） -->
  <path d="M 40 60 L 60 40 L 774 40 L 794 60 L 794 1052 L 774 1072 L 60 1072 L 40 1052 Z" 
        stroke="#00E5FF" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.8" />
  <!-- 内层副边框 -->
  <path d="M 52 70 L 70 52 L 764 52 L 782 70 L 782 1042 L 764 1060 L 70 1060 L 52 1042 Z" 
        stroke="#FB7299" stroke-width="1" fill="none" opacity="0.5" />
  
  <!-- 四角科技装饰 -->
  <g stroke="#00E5FF" stroke-width="2" fill="none">
    <!-- 左上 -->
    <path d="M 40 60 L 40 100 M 40 60 L 80 60" />
    <circle cx="40" cy="60" r="3" fill="#00E5FF" />
    <!-- 右上 -->
    <path d="M 794 60 L 794 100 M 794 60 L 754 60" />
    <circle cx="794" cy="60" r="3" fill="#00E5FF" />
    <!-- 左下 -->
    <path d="M 40 1052 L 40 1012 M 40 1052 L 80 1052" />
    <circle cx="40" cy="1052" r="3" fill="#00E5FF" />
    <!-- 右下 -->
    <path d="M 794 1052 L 794 1012 M 794 1052 L 754 1052" />
    <circle cx="794" cy="1052" r="3" fill="#00E5FF" />
  </g>

  <!-- ================= 顶部标题区 ================= -->
  <g>
    <!-- 标题文字 -->
    <text x="417" y="120" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" letter-spacing="12" filter="url(#glow)">
      万象星核
    </text>
    <text x="417" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#00E5FF" letter-spacing="18" filter="url(#glow)">
      NOVA BAY
    </text>
    
    <!-- 标题装饰线 -->
    <line x1="150" y1="185" x2="684" y2="185" stroke="#FB7299" stroke-width="1.5" opacity="0.6" filter="url(#glow)" />
    <circle cx="417" cy="185" r="4" fill="#00E5FF" filter="url(#glow)" />
    <circle cx="250" cy="185" r="2" fill="#FB7299" />
    <circle cx="584" cy="185" r="2" fill="#FB7299" />
  </g>

  <!-- ================= 中部核心视觉区 ================= -->
  <!-- 修复魔法阵 / 科技光环 -->
  <g>
    <circle cx="417" cy="510" r="280" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="15, 20" opacity="0.4" filter="url(#glow)" />
    <circle cx="417" cy="510" r="250" fill="none" stroke="#FB7299" stroke-width="1" stroke-dasharray="5, 15" opacity="0.3" />
    <circle cx="417" cy="510" r="310" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.2" />
    
    <!-- 旋转的科技点阵 -->
    <g fill="#00E5FF" opacity="0.6">
      <circle cx="417" cy="230" r="3" />
      <circle cx="417" cy="790" r="3" />
      <circle cx="137" cy="510" r="3" />
      <circle cx="697" cy="510" r="3" />
      <circle cx="217" cy="310" r="2" />
      <circle cx="617" cy="710" r="2" />
      <circle cx="617" cy="310" r="2" />
      <circle cx="217" cy="710" r="2" />
    </g>

    <!-- 数据修复连线（碎片汇聚） -->
    <g stroke-width="1.5" opacity="0.6">
      <line x1="180" y1="360" x2="317" y2="450" stroke="#00E5FF" />
      <line x1="650" y1="660" x2="517" y2="550" stroke="#FB7299" />
      <line x1="200" y1="630" x2="317" y2="550" stroke="#FFD700" />
      <line x1="630" y1="390" x2="517" y2="450" stroke="#00E5FF" />
      <line x1="300" y1="260" x2="380" y2="410" stroke="#FB7299" />
      <line x1="530" y1="760" x2="450" y2="590" stroke="#FFD700" />
    </g>

    <!-- 漂浮的数据碎片 -->
    <g filter="url(#glow)">
      <rect x="230" y="390" width="12" height="12" fill="#FB7299" transform="rotate(45 236 396)" opacity="0.8" />
      <rect x="580" y="430" width="10" height="10" fill="#00E5FF" transform="rotate(15 585 435)" opacity="0.8" />
      <rect x="560" y="590" width="14" height="14" fill="#FFD700" transform="rotate(30 567 597)" opacity="0.8" />
      <rect x="250" y="590" width="8" height="8" fill="#00E5FF" transform="rotate(10 254 594)" opacity="0.8" />
      <rect x="620" y="330" width="6" height="6" fill="#FB7299" transform="rotate(60 623 333)" opacity="0.8" />
      <rect x="200" y="690" width="10" height="10" fill="#00E5FF" transform="rotate(25 205 695)" opacity="0.8" />
    </g>
  </g>

  <!-- B站小电视与播放按钮 -->
  <g>
    <!-- 电视外壳 -->
    <rect x="307" y="410" width="220" height="160" rx="30" fill="url(#tvGrad)" stroke="#FB7299" stroke-width="6" filter="url(#glow)" />
    
    <!-- 电视天线 -->
    <line x1="357" y1="410" x2="327" y2="360" stroke="#FB7299" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
    <line x1="477" y1="410" x2="507" y2="360" stroke="#FB7299" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="327" cy="360" r="6" fill="#00E5FF" filter="url(#glow)" />
    <circle cx="507" cy="360" r="6" fill="#00E5FF" filter="url(#glow)" />
    
    <!-- 播放按钮（B站标志性三角形） -->
    <polygon points="387,450 387,530 477,490" fill="#FB7299" filter="url(#glow)" />
    
    <!-- 修复扫描线 / 全息效果 -->
    <rect x="307" y="410" width="220" height="160" rx="30" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="20, 40" opacity="0.6" />
  </g>

  <!-- ================= 底部信息区 ================= -->
  <!-- 分隔线 -->
  <g>
    <line x1="100" y1="830" x2="734" y2="830" stroke="#00E5FF" stroke-width="1.5" opacity="0.5" filter="url(#glow)" />
    <line x1="100" y1="834" x2="734" y2="834" stroke="#FB7299" stroke-width="0.5" opacity="0.3" />
    <circle cx="417" cy="832" r="4" fill="#00E5FF" filter="url(#glow)" />
  </g>

  <!-- 主标题文字 -->
  <g>
    <text x="417" y="910" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="40" fill="#FFFFFF" font-weight="bold" letter-spacing="8" filter="url(#glow)">
      B站收藏夹修复
    </text>
    <text x="417" y="960" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#FB7299" letter-spacing="12" filter="url(#glow)">
      BILIBILI FAVORITES FIX
    </text>
  </g>

  <!-- 底部科技装饰条 -->
  <g>
    <rect x="180" y="1010" width="474" height="24" rx="12" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.6" />
    <rect x="190" y="1017" width="60" height="10" rx="5" fill="#00E5FF" opacity="0.4" />
    <rect x="260" y="1017" width="120" height="10" rx="5" fill="#FB7299" opacity="0.4" />
    <rect x="390" y="1017" width="180" height="10" rx="5" fill="#FFD700" opacity="0.3" />
    <rect x="580" y="1017" width="64" height="10" rx="5" fill="#00E5FF" opacity="0.4" />
  </g>
</svg>